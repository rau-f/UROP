<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Research Opportunity Portal</h1>
    <p>Post, find and manage research openings in one place.</p>
  </header>

  <main>
    <div id="message" role="status"></div>

    <section>
      <h2>All opportunities</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Area</th><th>Faculty</th><th>Deadline</th><th>Positions</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section id="details" hidden>
      <h2>Opportunity details</h2>
      <dl id="details-body"></dl>
      <button type="button" id="hide-details" class="secondary">Hide details</button>
    </section>

    <section id="form-section">
      <h2 id="form-title">Post a new opportunity</h2>
      <form id="opp-form" novalidate>
        <input type="hidden" id="opp-id">
        <label>Title * <input id="title" maxlength="100"></label>
        <label>Research area * <input id="area" maxlength="50"></label>
        <label>Faculty member * <input id="researcher_name"></label>
        <label>Department * <input id="department" maxlength="50"></label>
        <label>Required skills <input id="required_skills" maxlength="100"></label>
        <label>Available positions * <input id="available_positions" type="number" min="0" step="1"></label>
        <label>Application deadline * <input id="deadline" type="date"></label>
        <label>Status
          <select id="status"><option>Open</option><option>Closed</option></select>
        </label>
        <label class="wide">Description <textarea id="description" rows="3" maxlength="500"></textarea></label>
        <div class="wide">
          <button type="submit" id="save">Save opportunity</button>
          <button type="button" id="cancel" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
